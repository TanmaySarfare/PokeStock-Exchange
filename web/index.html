<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéStock Exchange</title>
<meta name="theme-color" content="#0a0d12">
<link rel="icon" type="image/svg+xml" href="/img/logo.svg">
<link rel="alternate icon" href="/img/favicon.ico">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<svg class="ico-sheet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" fill="#f4f4f4"/><path d="M1.8 12a10.2 10.2 0 0 1 20.4 0H1.8z" fill="#ee1515"/><rect x="1.8" y="11" width="20.4" height="2" fill="#1a1a1a"/><circle cx="12" cy="12" r="10.2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="12" cy="12" r="3.6" fill="#1a1a1a"/><circle cx="12" cy="12" r="2.4" fill="#fff"/><circle cx="12" cy="12" r="1" fill="#1a1a1a"/></symbol>
  <symbol id="i-great" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" fill="#f4f4f4"/><path d="M1.8 12a10.2 10.2 0 0 1 20.4 0H1.8z" fill="#3b6cff"/><path d="M5.2 4.6 8.4 9.6H4.6z" fill="#ee1515"/><path d="M18.8 4.6 15.6 9.6h3.8z" fill="#ee1515"/><rect x="1.8" y="11" width="20.4" height="2" fill="#1a1a1a"/><circle cx="12" cy="12" r="10.2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="12" cy="12" r="3.6" fill="#1a1a1a"/><circle cx="12" cy="12" r="2.4" fill="#fff"/><circle cx="12" cy="12" r="1" fill="#1a1a1a"/></symbol>
  <symbol id="i-ultra" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" fill="#f4f4f4"/><path d="M1.8 12a10.2 10.2 0 0 1 20.4 0H1.8z" fill="#1a1a1a"/><path d="M12 1.8 15.1 10H8.9z" fill="#ffcb05"/><path d="M4.4 5.2 9.2 10.4H3.4z" fill="#ffcb05"/><path d="M19.6 5.2 14.8 10.4h5.8z" fill="#ffcb05"/><rect x="1.8" y="11" width="20.4" height="2" fill="#1a1a1a"/><circle cx="12" cy="12" r="10.2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="12" cy="12" r="3.6" fill="#1a1a1a"/><circle cx="12" cy="12" r="2.4" fill="#fff"/><circle cx="12" cy="12" r="1" fill="#1a1a1a"/></symbol>
  <symbol id="i-master" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" fill="#f4f4f4"/><path d="M1.8 12a10.2 10.2 0 0 1 20.4 0H1.8z" fill="#7b2cbf"/><circle cx="6.4" cy="6.4" r="1.7" fill="#ff6bd6"/><circle cx="17.6" cy="6.4" r="1.7" fill="#ff6bd6"/><path d="M12 3.2 13.4 7.2h4.1l-3.3 2.5 1.3 4-3.5-2.4-3.5 2.4 1.3-4-3.3-2.5h4.1z" fill="#ffcb05"/><rect x="1.8" y="11" width="20.4" height="2" fill="#1a1a1a"/><circle cx="12" cy="12" r="10.2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="12" cy="12" r="3.6" fill="#1a1a1a"/><circle cx="12" cy="12" r="2.4" fill="#fff"/><circle cx="12" cy="12" r="1" fill="#1a1a1a"/></symbol>
  <symbol id="i-dex" viewBox="0 0 24 24"><rect x="3" y="2.5" width="18" height="19" rx="2.4" fill="#ee1515"/><rect x="5" y="5" width="14" height="9.2" rx="1.2" fill="#1e2a3a"/><rect x="6.2" y="6.2" width="7.4" height="6.8" rx=".8" fill="#7ec8ff"/><circle cx="16.4" cy="8.2" r="1.4" fill="#2ecc71"/><circle cx="16.4" cy="11.4" r="1.1" fill="#ffcb05"/><rect x="5.4" y="16" width="13.2" height="1.4" rx=".7" fill="#fff" opacity=".55"/><rect x="5.4" y="18.2" width="8" height="1.2" rx=".6" fill="#fff" opacity=".3"/></symbol>
  <symbol id="i-berry" viewBox="0 0 24 24"><ellipse cx="12" cy="14.4" rx="7.4" ry="6.6" fill="#ff7a1a"/><ellipse cx="10.2" cy="12.4" rx="2.4" ry="1.6" fill="#fff" opacity=".35"/><path d="M12 8.2c0-3.6 3.6-5.6 6.4-5.4-1.6 2.4-1.2 4.6-2.8 5.8C14 9.6 12.8 9.2 12 8.2z" fill="#3dcc5a"/><path d="M12 8.2c0-2.8-2.2-4.8-4.8-5 1.2 2.2 1 4.2 2.4 5.4 1.1.9 1.8.6 2.4-.4z" fill="#2fa84a"/><path d="M12 8.2v5" stroke="#7a3a12" stroke-width="1.2" stroke-linecap="round"/></symbol>
  <symbol id="i-badge" viewBox="0 0 24 24"><path d="M12 2.2 14.7 8l6.4.6-4.8 4.3 1.4 6.3L12 16.4 6.3 19.2l1.4-6.3L2.9 8.6 9.3 8z" fill="#ffcb05"/><path d="M12 2.2 14.7 8l6.4.6-4.8 4.3 1.4 6.3L12 16.4z" fill="#ffe17a"/><path d="M12 2.2 14.7 8l6.4.6-4.8 4.3 1.4 6.3L12 16.4 6.3 19.2l1.4-6.3L2.9 8.6 9.3 8z" fill="none" stroke="#c98900" stroke-width="1.1" stroke-linejoin="round"/><circle cx="12" cy="11.2" r="2.4" fill="#ee1515"/><circle cx="12" cy="11.2" r="1.1" fill="#fff"/></symbol>
  <symbol id="i-potion" viewBox="0 0 24 24"><path d="M9.4 3.2h5.2v3.2c2.6 1.6 4.6 5 4.6 8.4A7.2 7.2 0 0 1 12 22a7.2 7.2 0 0 1-7.2-7.2c0-3.4 2-6.8 4.6-8.4V3.2z" fill="#ee1515"/><path d="M8.2 14.6c0-2.6 1.4-5 3-6.4 1.6 1.4 3 3.8 3 6.4 0 2.1-1.3 3.8-3 3.8s-3-1.7-3-3.8z" fill="#ff6b6b"/><rect x="8.2" y="2.2" width="7.6" height="2.4" rx="1.2" fill="#c9d4e0"/><circle cx="10.6" cy="13.2" r="1.1" fill="#fff" opacity=".5"/></symbol>
</svg>
<header class="topbar">
  <a class="brand" href="#/">
    <img class="logo" src="/img/logo.svg" width="38" height="38" alt="PokéStock">
    <span class="brand-text"><span class="brand-name">Poké<b>Stock</b></span><span class="brand-sub">Exchange</span></span>
  </a>
  <div class="composite" id="composite">
    <svg class="ico"><use href="#i-dex"/></svg>
    <span class="lbl">PKDX 1025</span>
    <span class="val" id="composite-val">—</span>
    <span class="chg" id="composite-chg">—</span>
  </div>
  <nav class="nav">
    <a href="#/" data-route="market"><svg class="ico"><use href="#i-ball"/></svg> Market</a>
    <a href="#/sectors" data-route="sectors"><svg class="ico"><use href="#i-berry"/></svg> Sectors</a>
    <a href="#/portfolio" data-route="portfolio"><svg class="ico"><use href="#i-potion"/></svg> Portfolio</a>
    <a href="#/news" data-route="news"><svg class="ico"><use href="#i-dex"/></svg> News</a>
    <a href="#/leaderboard" data-route="leaderboard"><svg class="ico"><use href="#i-badge"/></svg> Leaderboard</a>
  </nav>
  <div class="account" id="account">
    <span class="lbl" id="acct-name">—</span>
    <span class="val" id="acct-net">—</span>
    <span class="chg" id="acct-pnl">—</span>
  </div>
  <div class="clock"><span class="live" id="live-dot" title="Live feed"><svg class="ico"><use href="#i-ball"/></svg></span><span id="clock">--:--:--</span></div>
</header>

<div class="tape" id="tape"><div class="tape-track" id="tape-track"></div></div>

<main id="view" class="view"></main>

<div id="toast" class="toast"></div>

<template id="tpl-market">
  <section class="grid-market">
    <section class="panel movers">
      <h2><svg class="ico"><use href="#i-ball"/></svg> Top movers</h2>
      <div class="movers-cols">
        <div>
          <h3 class="up"><svg class="ico"><use href="#i-great"/></svg> Gainers</h3>
          <div class="mv-head"><span></span><span>Ticker</span><span>Name</span><span class="num">Price</span><span class="num">Chg%</span></div>
          <ul id="gainers"></ul>
        </div>
        <div>
          <h3 class="down"><svg class="ico"><use href="#i-ultra"/></svg> Losers</h3>
          <div class="mv-head"><span></span><span>Ticker</span><span>Name</span><span class="num">Price</span><span class="num">Chg%</span></div>
          <ul id="losers"></ul>
        </div>
      </div>
    </section>
    <section class="panel ticker-list">
      <div class="list-head">
        <h2><svg class="ico"><use href="#i-dex"/></svg> All listings <small class="count" id="list-count"></small></h2>
        <div class="controls">
          <input id="search" type="search" placeholder="Search name / ticker / type…" autocomplete="off">
          <select id="sector-filter"><option value="">All sectors</option></select>
          <select id="rarity-filter">
            <option value="">All rarities</option>
            <option>Legendary</option><option>Mythical</option><option>None</option>
          </select>
        </div>
      </div>
      <table class="tbl" id="tbl">
        <thead><tr>
          <th data-sort="dex">#</th>
          <th data-sort="symbol">Ticker</th>
          <th data-sort="name">Name</th>
          <th>Sector</th>
          <th data-sort="price" class="num">Price</th>
          <th data-sort="pct" class="num">Chg%</th>
          <th class="trend">Trend</th>
          <th data-sort="mcap" class="num">Mkt cap</th>
          <th data-sort="volatility" class="num">Beta</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <button class="more" id="more"><svg class="ico"><use href="#i-ball"/></svg> Show more</button>
    </section>
  </section>
</template>

<template id="tpl-sectors">
  <section class="sectors-page">
    <section class="panel">
      <h2><svg class="ico"><use href="#i-berry"/></svg> Type sectors <small>average % change vs session open · click a sector to see its listings</small></h2>
      <div class="heatmap big" id="heatmap"></div>
    </section>
    <section class="panel sector-detail" id="sector-detail" hidden>
      <div class="list-head">
        <h2 id="sector-title"></h2>
        <div class="sector-kpis" id="sector-kpis"></div>
      </div>
      <table class="tbl" id="sector-tbl">
        <thead><tr><th>#</th><th>Ticker</th><th>Name</th><th>Sector</th><th class="num">Price</th><th class="num">Chg%</th><th class="trend">Trend</th><th class="num">Mkt cap</th></tr></thead>
        <tbody id="sector-tbody"></tbody>
      </table>
    </section>
  </section>
</template>

<template id="tpl-ticker">
  <section class="ticker-page">
    <header class="ticker-head panel">
      <div class="art-wrap"><img class="art" id="t-art" width="126" height="126" decoding="async" alt=""></div>
      <div class="ident">
        <div class="sym-row"><span class="sym" id="t-sym"></span><span class="badges" id="t-badges"></span></div>
        <h1 id="t-name"></h1>
        <div class="muted" id="t-cat"></div>
      </div>
      <div class="quote">
        <div class="price" id="t-price"></div>
        <div class="chg" id="t-chg"></div>
        <div class="muted small" id="t-range"></div>
      </div>
      <form class="trade" id="trade-form">
        <label>Qty <input type="number" id="trade-qty" min="1" value="10"></label>
        <button type="button" class="buy" id="btn-buy">Buy</button>
        <button type="button" class="sell" id="btn-sell">Sell</button>
        <div class="muted small" id="trade-info"></div>
      </form>
    </header>
    <section class="panel chart-panel">
      <h2><svg class="ico"><use href="#i-ball"/></svg> Price <small id="chart-sub"></small></h2>
      <canvas id="chart" height="320"></canvas>
    </section>
    <aside class="panel fundamentals">
      <h2><svg class="ico"><use href="#i-badge"/></svg> Fundamentals</h2>
      <div class="stat-bars" id="stat-bars"></div>
      <dl class="kv" id="kv"></dl>
    </aside>
    <section class="panel prospectus">
      <h2><svg class="ico"><use href="#i-dex"/></svg> Prospectus</h2>
      <p id="t-prospectus"></p>
      <div class="risk" id="t-risk"></div>
    </section>
    <section class="panel family">
      <h2><svg class="ico"><use href="#i-berry"/></svg> Corporate family</h2>
      <div class="family-row" id="t-family"></div>
    </section>
    <section class="panel t-news">
      <h2><svg class="ico"><use href="#i-ball"/></svg> Ticker news</h2>
      <ul class="news-list" id="t-news"></ul>
    </section>
  </section>
</template>

<template id="tpl-portfolio">
  <section class="portfolio">
    <div class="panel summary">
      <div class="who">
        <input id="name-input" maxlength="24" placeholder="Trainer name">
        <input id="tag-input" class="tag-input" maxlength="40" placeholder="Motto shown on the leaderboard (optional)">
        <button id="name-save">Save</button>
      </div>
      <div class="bigs">
        <div><span class="lbl">Net worth</span><span class="val" id="p-net"></span></div>
        <div><span class="lbl">Cash</span><span class="val" id="p-cash"></span></div>
        <div><span class="lbl">Equity</span><span class="val" id="p-equity"></span></div>
        <div><span class="lbl">P&amp;L</span><span class="val" id="p-pnl"></span></div>
        <div><span class="lbl">Realized</span><span class="val" id="p-real"></span></div>
        <div><span class="lbl">Rank</span><span class="val" id="p-rank"></span></div>
      </div>
      <canvas id="nw-chart" height="90"></canvas>
    </div>
    <div class="panel">
      <h2><svg class="ico"><use href="#i-great"/></svg> Holdings</h2>
      <table class="tbl" id="holdings">
        <thead><tr><th></th><th>Ticker</th><th>Name</th><th class="num">Qty</th><th class="num">Avg cost</th><th class="num">Price</th><th class="num">Value</th><th class="num">P&amp;L</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="muted empty" id="holdings-empty"><svg class="ico lg"><use href="#i-master"/></svg> No positions yet. Head to the <a href="#/">market</a> and buy something that's Not Very Effective to hold.</p>
    </div>
    <div class="panel">
      <h2><svg class="ico"><use href="#i-ultra"/></svg> Recent trades</h2>
      <table class="tbl" id="trades"><thead><tr><th>Time</th><th>Side</th><th>Ticker</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead><tbody></tbody></table>
    </div>
  </section>
</template>

<template id="tpl-news">
  <section class="panel newsfeed">
    <h2><svg class="ico"><use href="#i-dex"/></svg> Market wire</h2>
    <ul class="news-list big" id="news-list"></ul>
  </section>
</template>

<template id="tpl-leaderboard">
  <section class="panel leaderboard">
    <h2><svg class="ico"><use href="#i-badge"/></svg> Top trainers</h2>
    <table class="tbl" id="lb"><thead><tr><th>#</th><th>Trainer</th><th class="num">Net worth</th><th class="num">P&amp;L%</th><th class="num">Positions</th><th>Largest</th></tr></thead><tbody></tbody></table>  </section>
</template>

<script src="/app.js"></script>
</body>
</html>
